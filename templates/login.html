{% extends "base_auth.html" %}

{% block titulo %}Login — Sistema de Assistência Técnica{% endblock %}

{% block conteudo %}
<section class="container auth-card">
    <h2>Entrar</h2>

    {% if erro %}
        <div class="flash flash--erro" role="alert">
            <span class="flash-icone" aria-hidden="true">⚠</span>
            <span>{{ erro }}</span>
        </div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
    </form>

    <p class="auth-link">
        <a href="/funcionarios/cadastrar">Cadastrar funcionário</a>
    </p>
</section>
{% endblock %}
