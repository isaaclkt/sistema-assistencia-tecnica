<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
</head>
<body>

<header>
    <div>
        <h1>Login de Funcionários</h1>
        <p>Acesse o sistema de gestao interna</p>
    </div>

    <div class="header-user">
        <span class="user-icon" aria-hidden="true"></span>
        <span>{{ session.get("funcionario_nome", "") }}</span>
    </div>
</header>

<main>
    <section class="container auth-card">
        <h2>Entrar</h2>

        {% if erro %}
            <p class="mensagem-vazia">{{ erro }}</p>
        {% endif %}

        <form action="/login" method="POST">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="auth-link">
            <a href="/funcionarios/cadastrar">Cadastrar funcionário</a>
        </p>
    </section>
</main>

</body>
</html>
