<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova ordem de serviço</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ordem-servico.css') }}">
</head>

<body>

<header>
    <div>
        <h1>Nova ordem de serviço</h1>
        <p>Registre uma nova solicitação de atendimento</p>
    </div>

    <div class="header-user">
        <span class="user-icon" aria-hidden="true"></span>
        <span>{{ session.get("funcionario_nome", "") }}</span>
    </div>
</header>

<main>
    <section class="card">
        <h2>Dados da ordem</h2>

        <form action="/ordem-servico/cadastrar" method="POST">
            <div class="campo">
                <label for="cliente_id">Cliente</label>
                <select id="cliente_id" name="cliente_id" required>
                    <option value="">Selecione um cliente</option>

                    {% for cliente in clientes %}
                    <option value="{{ cliente['id'] }}">
                        {{ cliente["nome"] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="equipamento">Equipamento</label>
                <input type="text" id="equipamento" name="equipamento" required>
            </div>

            <div class="campo">
                <label for="problema_relatado">Problema relatado</label>
                <textarea id="problema_relatado" name="problema_relatado" required></textarea>
            </div>

            <div class="campo">
                <label>Peças utilizadas</label>

                <div id="lista-pecas">
                    <div class="linha-peca">
                        <select name="peca_id" required>
                            <option value="">Selecione uma peça</option>

                            {% for peca in pecas %}
                            <option value="{{ peca['id'] }}">
                                {{ peca["nome"] }} - R$ {{ peca["preco_unitario"] }}
                            </option>
                            {% endfor %}
                        </select>

                        <input type="number" name="quantidade" min="1" value="1" required aria-label="Quantidade da peça">
                        <button type="button" class="btn-remover-peca" hidden>Remover</button>
                    </div>
                </div>

                <button type="button" id="adicionar-peca" class="btn">Adicionar outra peça</button>
            </div>

            <div class="campo">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Aberto">Aberto</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Finalizado">Finalizado</option>
                    <option value="Cancelado">Cancelado</option>
                </select>
            </div>

            <div class="botoes">
                <button type="submit">Criar ordem</button>
                <a href="/ordem-servico" class="btn btn-home">Voltar</a>
            </div>
        </form>
    </section>
</main>

<script>
    const listaPecas = document.querySelector("#lista-pecas");
    const botaoAdicionar = document.querySelector("#adicionar-peca");

    function atualizarBotoesRemover() {
        const linhas = listaPecas.querySelectorAll(".linha-peca");
        linhas.forEach((linha) => {
            linha.querySelector(".btn-remover-peca").hidden = linhas.length === 1;
        });
    }

    botaoAdicionar.addEventListener("click", () => {
        const novaLinha = listaPecas.querySelector(".linha-peca").cloneNode(true);
        novaLinha.querySelector("select").value = "";
        novaLinha.querySelector('input[name="quantidade"]').value = "1";
        listaPecas.appendChild(novaLinha);
        atualizarBotoesRemover();
    });

    listaPecas.addEventListener("click", (event) => {
        if (event.target.classList.contains("btn-remover-peca")) {
            event.target.closest(".linha-peca").remove();
            atualizarBotoesRemover();
        }
    });
</script>

</body>
</html>
