<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova ordem de servico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ordem-servico.css') }}">
</head>

<body>

<header>
    <div>
        <h1>Nova ordem de servico</h1>
        <p>Registre uma nova solicitacao de atendimento</p>
    </div>

    <div class="header-user">
        <span class="user-icon" aria-hidden="true"></span>
        <span>{{ session.get("funcionario_nome", "Visitante") }}</span>
    </div>
</header>

<main>
    <section class="card">
        <h2>Dados da ordem</h2>

        <form action="/ordem-servico/cadastrar" method="POST">
            <div class="campo">
                <label for="equipamento_id">Equipamento</label>
                <select id="equipamento_id" name="equipamento_id" required>
                    <option value="">Selecione um equipamento</option>

                    {% for equipamento in equipamentos %}
                    <option value="{{ equipamento['id'] }}">
                        {{ equipamento["cliente_nome"] }} -
                        {{ equipamento["tipo"] }}
                        {{ equipamento["marca"] or "" }}
                        {{ equipamento["modelo"] or "" }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo">
                <label for="defeito_relatado">Defeito relatado</label>
                <textarea id="defeito_relatado" name="defeito_relatado" required></textarea>
            </div>

            <div class="botoes">
                <button type="submit">Criar ordem</button>
                <a href="/ordem-servico" class="btn btn-home">Voltar</a>
            </div>
        </form>
    </section>
</main>

</body>
</html>
