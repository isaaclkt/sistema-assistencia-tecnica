{% extends "base.html" %}

{% block titulo %}Nova Ordem de Serviço{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ordem-servico.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Nova Ordem de Serviço</h1>
    <p>Registre uma nova solicitação de atendimento</p>
</div>

<section class="card">
    <h2>Dados da ordem</h2>

    <form action="/ordem-servico/cadastrar" method="POST">
        <div class="campo">
            <label for="cliente_id">Cliente <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <select id="cliente_id" name="cliente_id" required>
                <option value="">Selecione um cliente</option>
                {% for cliente in clientes %}
                <option value="{{ cliente['id'] }}">{{ cliente["nome"] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="equipamento">Equipamento <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="text" id="equipamento" name="equipamento" placeholder="Ex.: Notebook Dell Inspiron" required>
        </div>

        <div class="campo">
            <label for="problema_relatado">Problema relatado <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <textarea id="problema_relatado" name="problema_relatado" placeholder="Descreva o problema informado pelo cliente" required></textarea>
        </div>

        <div class="campo">
            <label>Peças utilizadas <span class="obrigatorio" title="Campo obrigatório">*</span></label>

            <div id="lista-pecas">
                <div class="linha-peca">
                    <select name="peca_id" required>
                        <option value="">Selecione uma peça</option>
                        {% for peca in pecas %}
                        <option value="{{ peca['id'] }}">{{ peca["nome"] }} - R$ {{ peca["preco_unitario"] }}</option>
                        {% endfor %}
                    </select>

                    <input type="number" name="quantidade" min="1" value="1" required aria-label="Quantidade da peça">
                    <button type="button" class="btn-remover-peca" hidden>Remover</button>
                </div>
            </div>

            <button type="button" id="adicionar-peca" class="btn">Adicionar outra peça</button>
        </div>

        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Aberto">Aberto</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Cancelado">Cancelado</option>
            </select>
        </div>

        <div class="botoes">
            <button type="submit">Criar ordem</button>
            <a href="/ordem-servico" class="btn btn-home">Voltar</a>
        </div>
    </form>
</section>
{% endblock %}

{% block scripts %}
<script>
    const listaPecas = document.querySelector("#lista-pecas");
    const botaoAdicionar = document.querySelector("#adicionar-peca");

    function atualizarOpcoesDisponiveis() {
        const selects = Array.from(listaPecas.querySelectorAll('select[name="peca_id"]'));
        const selecionadas = selects.map((select) => select.value).filter(Boolean);

        selects.forEach((select) => {
            Array.from(select.options).forEach((option) => {
                option.disabled =
                    option.value !== "" &&
                    option.value !== select.value &&
                    selecionadas.includes(option.value);
            });
        });
    }

    function atualizarBotoesRemover() {
        const linhas = listaPecas.querySelectorAll(".linha-peca");
        linhas.forEach((linha) => {
            linha.querySelector(".btn-remover-peca").hidden = linhas.length === 1;
        });
    }

    botaoAdicionar.addEventListener("click", () => {
        const novaLinha = listaPecas.querySelector(".linha-peca").cloneNode(true);
        novaLinha.querySelector("select").value = "";
        novaLinha.querySelector('input[name="quantidade"]').value = "1";
        listaPecas.appendChild(novaLinha);
        atualizarBotoesRemover();
        atualizarOpcoesDisponiveis();
    });

    listaPecas.addEventListener("click", (event) => {
        if (event.target.classList.contains("btn-remover-peca")) {
            event.target.closest(".linha-peca").remove();
            atualizarBotoesRemover();
            atualizarOpcoesDisponiveis();
        }
    });

    listaPecas.addEventListener("change", atualizarOpcoesDisponiveis);
    atualizarOpcoesDisponiveis();
</script>
{% endblock %}
