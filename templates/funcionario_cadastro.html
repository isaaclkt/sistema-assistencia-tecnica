{% extends "base_auth.html" %}

{% block titulo %}Cadastro de Funcionário{% endblock %}

{% block conteudo %}
<section class="container auth-card">
    <h2>Novo funcionário</h2>

    {% if erro %}
        <div class="flash flash--erro" role="alert">
            <span class="flash-icone" aria-hidden="true">⚠</span>
            <span>{{ erro }}</span>
        </div>
    {% endif %}

    <form action="/funcionarios/cadastrar" method="POST">
        <div class="campo">
            <label for="nome">Nome <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="campo">
            <label for="email">Email <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
            <label for="senha">Senha <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" placeholder="Ex.: Técnico, Atendente">
        </div>

        <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p class="auth-link">
        <a href="/login">Voltar para login</a>
    </p>
</section>
{% endblock %}
