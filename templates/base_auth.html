<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Acesso — Sistema de Assistência Técnica{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<main class="auth-wrapper">
    <div class="auth-brand">
        <span class="auth-logo" aria-hidden="true">
            {%- import 'partials/_icons.html' as icons -%}
            {{ icons.icon('wrench', 26) }}
        </span>
        <h1>Sistema de Assistência Técnica</h1>
        <p>Gestão interna de ordens, estoque, clientes e orçamentos</p>
    </div>

    {% include 'partials/_flash.html' %}

    {% block conteudo %}{% endblock %}
</main>

</body>
</html>
