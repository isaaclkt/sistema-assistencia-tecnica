{% extends "base.html" %}

{% block titulo %}Novo Cliente{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adicionar_clientes.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Gestão de Clientes</h1>
    <p>Cadastro de novos clientes</p>
</div>

<div class="card">
    <h2>Novo Cliente</h2>

    <form action="/clientes/cadastrar" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Nome <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="text" name="nome" required>
            </div>

            <div class="form-group">
                <label>CPF</label>
                <input type="text" name="cpf" placeholder="Somente números">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Endereço</label>
                <textarea name="endereco"></textarea>
            </div>
        </div>

        <div class="botoes">
            <button type="submit">Cadastrar Cliente</button>
            <a href="/cadastro" class="voltar">Voltar</a>
        </div>
    </form>
</div>
{% endblock %}
