<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adicionar_clientes.css') }}">
</head>

<body>

<header>
    <div>
        <h1>Gestão de Clientes</h1>
        <p>Cadastro de novos clientes</p>
    </div>

    <div class="header-user">
        <span class="user-icon" aria-hidden="true"></span>
        <span>{{ session.get("funcionario_nome", "") }}</span>
    </div>
</header>

<main>
    <div class="card">
        <h2>Novo Cliente</h2>

        <form action="/clientes/cadastrar" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" name="nome" required>
                </div>

                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" name="cpf">
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" name="telefone">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group">
                    <label>Endereço</label>
                    <textarea name="endereco"></textarea>
                </div>

            </div>

            <div class="botoes">
                <button type="submit">Cadastrar Cliente</button>
                <a href="/cadastro" class="voltar">Voltar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
