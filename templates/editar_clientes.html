{% extends "base.html" %}

{% block titulo %}Atualizar Cliente{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_clientes.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Atualizar Cliente</h1>
    <p>Atualize as informações do cliente selecionado</p>
</div>

<div class="card">
    <h2>Dados do Cliente</h2>

    <form action="/clientes/atualizar/{{ cliente['id'] }}" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Nome <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="text" name="nome" value="{{ cliente['nome'] }}" required>
            </div>

            <div class="form-group">
                <label>CPF <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="text" name="cpf" value="{{ cliente['cpf'] }}" required>
            </div>

            <div class="form-group">
                <label>Telefone <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="text" name="telefone" value="{{ cliente['telefone'] }}" required>
            </div>

            <div class="form-group">
                <label>Email <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="email" name="email" value="{{ cliente['email'] }}" required>
            </div>

            <div class="form-group">
                <label>Endereço <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <textarea name="endereco" required>{{ cliente['endereco'] }}</textarea>
            </div>
        </div>

        <div class="botoes">
            <button type="submit">Salvar Alterações</button>
            <a href="/cadastro" class="voltar">Voltar</a>
        </div>
    </form>
</div>
{% endblock %}
