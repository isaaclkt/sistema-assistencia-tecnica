{% extends "base.html" %}

{% block titulo %}Editar Peça{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_peca.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Editar Peça</h1>
    <p>Atualize as informações do item selecionado</p>
</div>

<section class="card">
    <h2>Dados da peça</h2>

    <form action="/estoque/atualizar/{{ peca['id'] }}" method="POST">
        <div class="form-grid">
            <div class="campo">
                <label>Nome <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="text" name="nome" value="{{ peca['nome'] }}" required>
            </div>

            <div class="campo">
                <label>Descrição</label>
                <input type="text" name="descricao" value="{{ peca['descricao'] }}">
            </div>

            <div class="campo">
                <label>Quantidade <span class="obrigatorio" title="Campo obrigatório">*</span></label>
                <input type="number" name="quantidade" value="{{ peca['quantidade'] }}" min="0" required>
            </div>

            <div class="campo">
                <label>Estoque mínimo</label>
                <input type="number" name="estoque_minimo" value="{{ peca['estoque_minimo'] }}" min="0">
            </div>

            <div class="campo">
                <label>Preço unitário</label>
                <input type="number" step="0.01" min="0" name="preco_unitario" value="{{ peca['preco_unitario'] }}">
            </div>

            <div class="campo">
                <label>Fornecedor</label>
                <input type="text" name="fornecedor" value="{{ peca['fornecedor'] }}">
            </div>
        </div>

        <div class="botoes">
            <button type="submit">Salvar Alterações</button>
            <a href="/estoque" class="btn btn-home">Voltar</a>
        </div>
    </form>
</section>
{% endblock %}
