<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de serviço</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #1f2937;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .editar {
            background-color: #f59e0b;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            margin-right: 6px;
        }

        .excluir {
            background-color: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
        }

        .editar:hover {
            background-color: #d97706;
        }

        .excluir:hover {
            background-color: #b91c1c;
        }

        .btn-home {
            background-color: #6b7280;
        }

        .btn-home:hover {
            background-color: #4b5563;
    }
    </style>
</head>
<header>
    <h1>Ordens de serviço</h1>
    <p></p>
</header>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Defeito relatado</th>
            <th>Status</th>
            <th>Data de abertura</th>
        </tr>

        {% for ordem in ordens %}
        <tr>
            <td>{{ ordem["id"] }}</td>
            <td>{{ ordem["defeito_relatado"] }}</td>
            <td>{{ ordem["status"] }}</td>
            <td>{{ ordem["data_abertura"] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">Nenhuma ordem cadastrada.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
