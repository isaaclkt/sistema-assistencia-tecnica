<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentar Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/movimentar_estoque.css') }}">
</head>
<body>

<header>
    <div>
        <h1>Movimentacao de Estoque</h1>
        <p>Registre entradas e saídas de peças</p>
    </div>

    <div class="header-user">
        <span class="user-icon" aria-hidden="true"></span>
        <span>{{ session.get("funcionario_nome", "") }}</span>
    </div>
</header>

<main>
    <section class="card">
        <h2>{{ peca['nome'] }}</h2>

        <p class="summary-pill">
            Quantidade atual: <strong>{{ peca['quantidade'] }}</strong>
        </p>

        <form method="POST">
            <div class="campo">
                <label>Tipo:</label>
                <select name="tipo">
                    <option value="Entrada">Entrada</option>
                    <option value="Saida">Saida</option>
                </select>
            </div>

            <div class="campo">
                <label>Quantidade:</label>
                <input type="number" name="quantidade" min="1" required>
            </div>

            <div class="campo">
                <label>Observacao:</label>
                <input type="text" name="observacao">
            </div>

            <div class="botoes">
                <button type="submit">Salvar Movimentacao</button>
                <a href="/estoque" class="btn btn-home">Voltar</a>
            </div>
        </form>
    </section>
</main>

</body>
</html>
