{% extends "base.html" %}

{% block titulo %}Movimentar Estoque{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/movimentar_estoque.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Movimentação de Estoque</h1>
    <p>Registre entradas e saídas de peças</p>
</div>

<section class="card">
    <h2>{{ peca['nome'] }}</h2>

    <p class="summary-pill">
        Quantidade atual: <strong>{{ peca['quantidade'] }}</strong>
    </p>

    <form method="POST">
        <div class="campo">
            <label for="tipo">Tipo de movimentação</label>
            <select id="tipo" name="tipo">
                <option value="Entrada">Entrada (adicionar ao estoque)</option>
                <option value="Saida">Saída (retirar do estoque)</option>
            </select>
        </div>

        <div class="campo">
            <label for="quantidade">Quantidade <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="number" id="quantidade" name="quantidade" min="1" required>
        </div>

        <div class="campo">
            <label for="observacao">Observação</label>
            <input type="text" id="observacao" name="observacao" placeholder="Ex.: compra do fornecedor, uso em ordem #12">
        </div>

        <div class="botoes">
            <button type="submit">Salvar Movimentação</button>
            <a href="/estoque" class="btn btn-home">Voltar</a>
        </div>
    </form>
</section>
{% endblock %}
