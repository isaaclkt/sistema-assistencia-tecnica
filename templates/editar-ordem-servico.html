{% extends "base.html" %}

{% block titulo %}Editar Ordem de Serviço{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ordem-servico.css') }}">
{% endblock %}

{% block conteudo %}
<div class="page-head">
    <h1>Editar Ordem de Serviço</h1>
    <p>Atualize os dados da solicitação de atendimento</p>
</div>

<section class="card">
    <h2>Dados da ordem</h2>

    <form action="/ordem-servico/atualizar/{{ ordem['ordem_id'] }}" method="POST">
        <div class="campo">
            <label for="cliente_id">Cliente <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <select id="cliente_id" name="cliente_id" required {% if pode('tecnico') %}disabled{% endif %}>
                <option value="">Selecione um cliente</option>
                {% for cliente in clientes %}
                <option value="{{ cliente['id'] }}" {% if cliente['id'] == ordem['cliente_id'] %}selected{% endif %}>
                    {{ cliente["nome"] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="funcionario_id">Funcionário responsável <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <select id="funcionario_id" name="funcionario_id" required {% if pode('tecnico') %}disabled{% endif %}>
                <option value="">Selecione um funcionário</option>
                {% for funcionario in funcionarios %}
                <option value="{{ funcionario['id'] }}" {% if funcionario['id'] == ordem['funcionario_id'] %}selected{% endif %}>
                    {{ funcionario["nome"] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="equipamento">Equipamento <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <input type="text" id="equipamento" name="equipamento" value="{{ ordem['equipamento'] }}" required {% if pode('tecnico') %}readonly{% endif %}>
        </div>

        <div class="campo">
            <label for="problema_relatado">Problema relatado <span class="obrigatorio" title="Campo obrigatório">*</span></label>
            <textarea id="problema_relatado" name="problema_relatado" required {% if pode('tecnico') %}readonly{% endif %}>{{ ordem['problema_relatado'] }}</textarea>
        </div>

        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Aberto" {% if ordem['status'] == 'Aberto' %}selected{% endif %}>Aberto</option>
                <option value="Em andamento" {% if ordem['status'] == 'Em andamento' %}selected{% endif %}>Em andamento</option>
                <option value="Finalizado" {% if ordem['status'] == 'Finalizado' %}selected{% endif %}>Finalizado</option>
                <option value="Cancelado" {% if ordem['status'] == 'Cancelado' %}selected{% endif %}>Cancelado</option>
            </select>
        </div>

        <div class="campo">
            <label for="laudo">Laudo técnico</label>
            <textarea id="laudo" name="laudo" placeholder="Diagnóstico e serviço executado (preenchido pelo técnico)">{{ ordem['laudo'] or '' }}</textarea>
        </div>

        <div class="form-grid">
            <div class="campo">
                <label for="garantia">Garantia</label>
                <input type="text" id="garantia" name="garantia" value="{{ ordem['garantia'] or '' }}" placeholder="Ex.: 90 dias" {% if pode('tecnico') %}readonly{% endif %}>
            </div>

            <div class="campo">
                <label for="prazo_entrega">Prazo de entrega</label>
                <input type="date" id="prazo_entrega" name="prazo_entrega" value="{{ ordem['prazo_entrega'] or '' }}" {% if pode('tecnico') %}readonly{% endif %}>
            </div>
        </div>

        <div class="botoes">
            <button type="submit">Salvar ordem</button>
            <a href="/ordem-servico" class="btn btn-home">Voltar</a>
        </div>
    </form>
</section>
{% endblock %}
